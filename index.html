<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학생 커뮤니티</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="top-bar">

        <h1>💬 학생 커뮤니티</h1>

        <a href="/write" class="write-main-btn">
            글쓰기
        </a>

    </div>

    {% for post in posts %}

    <div class="post-card">

        <div class="post-top">

            <span class="badge-category">
                익명 {{ post.mbti }}
            </span>

            {% if post.likes == 0 %}
            <span class="waiting-badge">
                ❓ 답변 필요
            </span>
            {% endif %}

        </div>

        <h2 class="post-title">
            {{ post.title }}
        </h2>

        <p class="post-preview">
            {{ post.content }}
        </p>

        <div class="post-bottom">

            <span>
                ❤️ {{ post.likes }}
            </span>

            <a href="/like/{{ loop.index0 }}">
                공감하기
            </a>

        </div>

    </div>

    {% endfor %}

</div>

</body>
</html>
